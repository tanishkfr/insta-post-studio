n>\n    <details class=\"menu\"><summary class=\"btn\">More<\/summary><div class=\"pop\">\n      <button class=\"btn\" id=\"cs\">Copy SVG<\/button><button class=\"btn\" id=\"png\">Export PNG<\/button><button class=\"btn\" id=\"cj\">Copy JSON<\/button><button class=\"btn\" id=\"lj\">Load JSON<\/button><\/div><\/details>\n    <button class=\"btn fill\" id=\"svg\">Export SVG<\/button>\n  <\/div>\n<\/header>\n<main>\n  <div class=\"tb\" role=\"toolbar\" aria-label=\"Canvas tools\">\n    <div class=\"grp\"><button class=\"btn\" id=\"imp\" title=\"Import an SVG, PNG or JPG to edit\">Import<\/button><\/div><i class=\"div\"><\/i>\n    <div class=\"grp\"><button class=\"btn\" id=\"tUndo\">Undo<\/button><button class=\"btn\" id=\"tRedo\">Redo<\/button><\/div><i class=\"div\"><\/i>\n    <div class=\"grp\"><button class=\"btn\" id=\"tCopy\">Copy<\/button><button class=\"btn\" id=\"tArea\" title=\"Copy only the part inside the selected area\">Copy area<\/button><button class=\"btn\" id=\"tCut\">Cut<\/button><button class=\"btn\" id=\"tPaste\">Paste<\/button><button class=\"btn\" id=\"tDup\">Duplicate<\/button><button class=\"btn danger\" id=\"tDel\">Delete<\/button><button class=\"btn danger\" id=\"tClear\" title=\"Remove every line and the title text\">Clear canvas<\/button><\/div><i class=\"div\"><\/i>\n    <div class=\"grp\"><button class=\"btn\" id=\"tAll\">Select all<\/button><button class=\"btn on\" id=\"tSnap\" aria-pressed=\"true\">Snap<\/button><\/div>\n    <span class=\"sp\"><\/span><span class=\"cap\" id=\"meta\"><\/span>\n    <div class=\"grp\"><button class=\"btn ico\" id=\"zOut\" aria-label=\"Zoom out\" title=\"Zoom out\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"/><\/svg><\/button><button class=\"btn\" id=\"zFit\">Fit<\/button><button class=\"btn ico\" id=\"zIn\" aria-label=\"Zoom in\" title=\"Zoom in\"><svg viewBox=\"0 0 24 24\" width=\"16\" height=\"16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M5 12h14\"/><path d=\"M12 5v14\"/><\/svg><\/button><\/div>\n    <button class=\"btn\" id=\"inspBtn\" aria-controls=\"insp\" aria-expanded=\"false\">Inspector<\/button>\n  <\/div>\n  <div id=\"wrap\"><div id=\"stage\"><\/div><\/div>\n<\/main>\n<aside id=\"insp\" aria-label=\"Inspector\"><div class=\"ah\"><h2 class=\"ph\">Inspector<\/h2><button class=\"btn\" id=\"inspX\">Close<\/button><\/div>\n  <div class=\"seg\" role=\"tablist\"><button class=\"btn on\" role=\"tab\" aria-selected=\"true\" data-tab=\"gen\">Generate<\/button><button class=\"btn\" role=\"tab\" aria-selected=\"false\" data-tab=\"edit\">Edit<\/button><\/div>\n  <div id=\"genPane\">\n    <div class=\"note\" id=\"bk\" hidden><span class=\"cap\">You are editing lines by hand. Line colour, field and mode settings are paused.<\/span><button class=\"btn\" id=\"unbake\">Back to generated<\/button><\/div>\n    <div class=\"seg\" id=\"modes\"><\/div>\n    <div class=\"presets\" id=\"presets\"><\/div>\n    <div class=\"presets\" id=\"palettes\"><\/div>\n    <div id=\"ctl\"><\/div>\n  <\/div>\n  <div id=\"editPane\" hidden><\/div>\n<\/aside>\n<div class=\"scrim\" id=\"scrim\"><\/div>\n<\/div>\n<input type=\"file\" id=\"impF\" accept=\".svg,image/svg+xml,image/png,image/jpeg\" hidden>\n<div class=\"toast\" id=\"toast\" role=\"status\" aria-live=\"polite\"><\/div>\n<dialog id=\"dlg\" aria-labelledby=\"dT\" aria-describedby=\"dB\"><form id=\"dF\" method=\"dialog\"><h2 id=\"dT\"><\/h2><p id=\"dB\"><\/p><div id=\"dX\"><\/div><p id=\"dE\" role=\"alert\"><\/p><div class=\"dact\"><button class=\"btn\" id=\"dC\" type=\"button\"><\/button><button class=\"btn fill\" id=\"dOk\" type=\"submit\"><\/button><\/div><\/form><\/dialog>\n\n<script>\n/* ==========================================================================\n   FlowEngine \u2014 pure generator, no DOM. Integration surface for the host app:\n     FlowEngine.defaults            full parameter object\n     FlowEngine.reg                 plugin registries: mode / field / palette / preset\n     FlowEngine.register(kind,def)  add a plugin (before the last line of this file, or call FlowStudio.rebuild())\n       'mode'    {id,label,params:[...],defaults:{},generate(p,C,items,R)}  push items {d,fill,w,t,u,v}\n       'field'   {id,label,params,defaults,make(p,C)->(x,y,ch)=>number (about +-.5)}\n       'palette' {id,label,values:{bg,ink,ink2,accent}}\n       'preset'  {id,label,values:{any params}}\n     Plugins receive C.field (active field), C.kit (rng,fbm,noise2,poly,pt,mixc) and C.W,H,x0,x1,y0,y1.\n     Param descriptors come from FlowEngine.param.num/chk/sel \u2014 the UI builds itself from them.\n     NEW REFERENCE = register a mode and/or field, then a palette + preset that reproduces it.\n     FlowEngine.generate(params) -> { svg, items, W, H }\n   `items` is the renderer-agnostic list of primitives (path d, fill/stroke,\n   weight, colour, accent flag). params.ov = { [itemIndex]: {c, w, h} } holds\n   per-line overrides (colour, weight offset, hidden).\n   ========================================================================== */\nconst FlowEngine=(()=>{\nconst SIZES={poster:[1000,1414],square:[1000,1000],phone:[1000,2166],story:[1000,1778],wide:[1600,1000]};\nconst DEF={mode:'s',field:'fbm',size:'poster',margin:38,topInset:250,clip:1,seed:7,\n bg:'#ECE4E0',ink:'#A33714',ink2:'#E08A5B',accent:'#FFFFFF',grad:'none',lineOp:1,fade:0,\n nth:0,accentW:2.2,accentOp:1,glow:0,\n scale:1.1,octaves:3,warp:70,angle:0,waveAmp:45,waveFreq:2.2,waveFall:.9,vs:3.2,vx:.72,vy:.55,vr:.16,twist:1.2,peak:1,tilt:1,\n rows:62,samples:140,tmin:.05,tmax:.92,curve:1.3,flip:0,tvar:.25,\n count:1600,step:3,len:120,wmin:.5,wmax:1,sep:3,\n levels:42,res:110,cw:1,\n showText:1,title1:'ABOUT',title2:'FLOW',body:'Flow is a state of complete immersion in an activity, where time seems to disappear. When you are in flow, y $('#tf').innerHTML=ROLE(n).map((r,i)=>`<div class="sl"><h3>${r}</h3><label for="th${i}">Headline</label><textarea id="th${i}" rows="2" placeholder="Make it loud"></textarea><label for="ts${i}">Subhead (optional)</label><textarea id="ts${i}" rows="2" placeholder="Issue 04 · Autumn 2026"></textarea></div>`).join('');
ROLE(n).forEach((_,i)=>{$('#th'+i).value=dflt(i).head;$('#ts'+i).value=dflt(i).sub});F.texts=readT();$('#hero').classList.add('out');$('#flow').hidden=false;show(0)}
function pills(){$('#steps').innerHTML=ST.map((s,i)=>`<button class="sp${i===F.step?' on':''}${i<F.step?' ok':''}" data-i="${i}"><i>${i<F.step?'✓':i+1}</i><span>${s}</span></button>`).join('')}
$('#steps').onclick=e=>{const b=e.target.closest('.sp');if(b&&!b.disabled){if(F.step===0)F.texts=readT();show(+b.dataset.i)}};
function show(i){if(i===3)[['image','fi'],['vector','fv']].forEach(([k,id])=>{if(F.loaded[id]&&!F.skip[k])useAsset(k)});F.step=i;F.max=Math.max(F.max,i);pills();$('#msg').textContent='';
for(let k=0;k<4;k++)$('#p'+k).hidden=k!==i;
if(FR[i]){const[id,key]=FR[i],f=$('#'+id);if(!F.loaded[id]){F.loaded[id]=1;f.onload=()=>{if(id==='fg'){F.ready=true;pushGen()}};f.srcdoc=SRC[key]}else{try{f.contentWindow.dispatchEvent(new Event('resize'))}catch(e){}}}
if(i===3)pushGen();
$('#bk').hidden=false;$('#bk').textContent=i===0?'Change format':'Back';
$('#sk').hidden=!(i===1||i===2);$('#sk').textContent=i===1?'Skip image':'Skip vector';
$('#nx').hidden=i===3;$('#nx').textContent='Continue';
$('#nx').disabled=false;
$('#msg').textContent=i===1?'Make your image, press “Use in Generate” under it, then Continue.':i===2?'Make your vector, press “Use in Generate” under it, then Continue.':i===3?'Compose your post. Change a control to update the previews; Regenerate gives new alternatives.':''}
$('#bk').onclick=()=>{if(F.step===0){F.texts=readT();$('#flow').hidden=true;$('#hero').classList.remove('out');$('#s0').hidden=true;$('#s1').hidden=false;$('#s1').classList.remove('gone');requestAnimationFrame(tick)}else show(F.step-1)};
$('#nx').onclick=()=>{if(F.step===0){F.texts=readT();show(1)}else if(F.step===1)advance('image');else if(F.step===2)advance('vector')};
$('#sk').onclick=()=>{if(F.step===1){F.img=null;F.skip.image=true}else{F.svg=null;F.skip.vector=true}show(F.step+1)};
const readT=()=>Array.from({length:F.n},(_,i)=>({head:$('#th'+i).value.trim()||dflt(i).head,sub:$('#ts'+i).value.trim()||dflt(i).sub}));
function useAsset(kind){const out=$('#us-'+kind);
try{const f=$(kind==='image'?'#fi':'#fv'),d=f.contentDocument;if(!d)throw new Error('contentDocument is null (frame not loaded or cross-origin)');
if(kind==='image'){const c=d.querySelector('#cv');if(!c)throw new Error('canvas #cv not found');F.img=c.toDataURL('image/png');out.textContent='Image captured ('+c.width+' × '+c.height+')'}
else{const sv=d.querySelector('#stage svg');if(!sv)throw new Error('svg not found in #stage');const cl=sv.cloneNode(true),ov=cl.querySelector('#ovl');if(ov)ov.remove();
if(!cl.getAttribute('xmlns'))cl.setAttribute('xmlns','http://www.w3.org/2000/svg');
const t=new f.contentWindow.XMLSerializer().serializeToString(cl),vb=(cl.getAttribute('viewBox')||'').trim().split(/[\s,]+/).map(Number),W=vb[2]||+cl.getAttribute('width')||1000,H=vb[3]||+cl.getAttribute('height')||1000;
F.svg={src:'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(t),W,H};out.textContent='Vector captured ('+Math.round(W)+' × '+Math.round(H)+')'}
F.sent='';F.skip[kind]=false;return true}catch(e){out.textContent='Could not read the '+kind+' tool: '+e.name+': '+e.message;return false}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-use]');if(b)useAsset(b.dataset.use)});
function advance(kind){if(!(kind==='image'?F.img:F.svg))useAsset(kind);show(F.step+1)}
function pushGen(){if(!F.ready||F.step!==3)return;const m={type:'setup',n:F.n,texts:F.texts,img:F.img,svg:F.svg},k=JSON.stringify(m);
if(k===F.sent)return;F.sent=k;$('#fg').contentWindow.postMessage(m,'*')}
</script></body></html>

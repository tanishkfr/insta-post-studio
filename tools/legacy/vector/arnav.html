<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow — generative vector studio</title>
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Sans+3:ital,wght@0,300;0,700;1,300&display=swap" rel="stylesheet">
<style>
:root{--color-background:#FFFFFF;--color-workspace:#F3F7F6;--color-workspace-alt:#EDF3F2;--color-hover:#EAF1EF;--color-selected:#DCEFEB;--color-accent:#236F72;--color-accent-pressed:#19595C;--color-accent-on:#FFFFFF;--color-text:#193438;--color-text-muted:#526C6E;--color-text-disabled:#728486;--color-border:#DEE7E5;--color-control-border:#A7BFC0;--color-focus:#236F72;--color-danger:#A63036;
--font-ui:'Instrument Sans','Inter',system-ui,sans-serif;--radius-small:6px;--radius-control:8px;--radius-panel:10px;--radius-overlay:12px;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--motion-quick:120ms;--motion-context:220ms;--motion-spatial:300ms;--ease:cubic-bezier(.2,0,0,1)}
@media(prefers-reduced-motion:reduce){:root{--motion-quick:0ms;--motion-context:0ms;--motion-spatial:0ms}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--color-background);color:var(--color-text);font:400 14px/1.45 var(--font-ui);font-variant-numeric:tabular-nums;color-scheme:light}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,24vw,344px);grid-template-rows:56px minmax(0,1fr);height:100vh;height:100dvh}
header{position:relative;z-index:40;grid-column:1/-1;display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-4);border-bottom:1px solid var(--color-border);background:var(--color-background)}
.brand{display:flex;align-items:baseline;gap:var(--space-2)}.brand span{color:var(--color-text-muted);font-weight:500}
h1{margin:0;font-size:20px;line-height:1.25;font-weight:600;letter-spacing:-.015em}
.sp{flex:1}.acts,.grp{display:flex;gap:var(--space-2);align-items:center}.grp{gap:var(--space-1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);height:32px;padding:0 var(--space-3);border:1px solid var(--color-control-border);background:transparent;border-radius:var(--radius-control);font-size:13px;line-height:1.3;font-weight:500;cursor:pointer;transition:background var(--motion-quick),color var(--motion-quick),border-color var(--motion-quick);white-space:nowrap}
.acts .btn{height:36px}.btn.ico{width:32px;padding:0}
.btn:hover:not(:disabled){background:var(--color-hover)}.btn:active:not(:disabled){background:var(--color-selected)}
.btn:disabled{color:var(--color-text-disabled);border-color:var(--color-border);cursor:default}
.btn.on{background:var(--color-selected);border-color:var(--color-selected);font-weight:600}
.btn.fill{background:var(--color-accent);border-color:var(--color-accent);color:#fff;height:36px}.btn.fill:hover:not(:disabled),.btn.fill:active:not(:disabled){background:var(--color-accent-pressed);border-color:var(--color-accent-pressed)}
.btn.fill.dng{background:var(--color-danger);border-color:var(--color-danger)}.btn.fill.dng:hover:not(:disabled){background:#8A272C;border-color:#8A272C}
.btn.danger{color:var(--color-danger);border-color:var(--color-danger)}.btn.danger:disabled{color:var(--color-text-disabled);border-color:var(--color-border)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--color-focus);outline-offset:2px}
details.menu{position:relative}details.menu>summary{list-style:none;display:inline-flex;align-items:center;padding:0 var(--space-3);font-size:13px;font-weight:500;line-height:1.3;gap:var(--space-2)}details.menu>summary::-webkit-details-marker{display:none}
.pop{position:absolute;right:0;top:calc(100% + var(--space-1));z-index:20;background:var(--color-background);border:1px solid var(--color-border);border-radius:var(--radius-overlay);padding:var(--space-1);display:flex;flex-direction:column;gap:var(--space-1);min-width:160px;box-shadow:0 8px 24px -12px rgba(25,52,56,.3);animation:popin var(--motion-quick) var(--ease)}
.menu.closing .pop{opacity:0;transform:translateY(-4px);transition:opacity var(--motion-quick),transform var(--motion-quick)}
@keyframes popin{from{opacity:0;transform:translateY(-4px)}}
.pop .btn{border-color:transparent;justify-content:flex-start}
main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--color-workspace)}
.tb{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-bottom:1px solid var(--color-border);background:var(--color-background)}
.div{width:1px;height:20px;background:var(--color-border)}#tSnap{min-width:64px}#inspBtn,.ah,.scrim{display:none}
.cap{font-size:12px;line-height:1.4;color:var(--color-text-muted)}
#wrap{flex:1;min-height:0;overflow:auto;display:flex;padding:var(--space-5)}
#stage{margin:auto;line-height:0}
#stage svg{display:block;outline:1px solid var(--color-border);touch-action:none;user-select:none;-webkit-user-select:none}
aside{border-left:1px solid var(--color-border);background:var(--color-background);overflow:auto;min-height:0}
.ph{margin:0;font-size:15px;line-height:1.35;font-weight:600}
.seg{position:relative;display:flex;gap:var(--space-1);padding:var(--space-1);background:var(--color-workspace-alt);border-radius:var(--radius-control);margin:var(--space-3) var(--space-4) 0}
.seg .btn{flex:1;border:0;border-radius:var(--radius-small)}.seg .btn.on{background:var(--color-selected)}
.presets{display:flex;flex-wrap:wrap;gap:var(--space-2);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-border)}
.sw{width:24px;height:16px;border-radius:var(--radius-small);box-shadow:inset 0 0 0 1px var(--color-border);flex:none}
.note{margin:var(--space-3) var(--space-4) 0;padding:var(--space-3);background:var(--color-workspace);border-radius:var(--radius-panel);display:flex;flex-direction:column;gap:var(--space-2);align-items:flex-start}
#ctl>details{border-bottom:1px solid var(--color-border)}
details>summary{list-style:none;cursor:pointer}
#ctl summary{padding:var(--space-3) var(--space-4);font-size:15px;line-height:1.35;font-weight:600;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:'';width:7px;height:7px;border-right:1.5px solid var(--color-text-muted);border-bottom:1.5px solid var(--color-text-muted);transform:rotate(45deg);transition:transform var(--motion-quick)}
details[open]>summary::after{transform:rotate(-135deg)}
.sec{padding:0 var(--space-4) var(--space-3)}
.row{display:grid;grid-template-columns:104px 1fr 48px;align-items:center;gap:var(--space-2);margin:var(--space-2) 0;font-size:13px}
.row label{font-weight:500}.row.wide{grid-template-columns:104px 1fr}.row.frozen{opacity:.45;pointer-events:none}
.val{font-size:12px;text-align:right;color:var(--color-text-muted)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(var(--color-accent),var(--color-accent)) 0/var(--p,0%) 100% no-repeat,var(--color-control-border)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--color-control-border)}input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--color-accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--color-accent);border:2px solid #fff;box-shadow:0 0 0 1px var(--color-accent);margin-top:-6px}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--color-accent);border:2px solid #fff;box-shadow:0 0 0 1px var(--color-accent)}
input[type=text],input[type=number],select,textarea{width:100%;height:32px;padding:0 var(--space-2);background:var(--color-background);border:1px solid var(--color-control-border);border-radius:var(--radius-control);font-size:13px}
textarea{height:auto;min-height:96px;padding:var(--space-2);resize:vertical}
select{cursor:pointer}
.colr{display:flex;gap:var(--space-2);align-items:center;grid-column:2/4}
.colr input[type=color]{width:32px;height:32px;padding:2px;flex:none;border:1px solid var(--color-control-border);border-radius:var(--radius-control);background:var(--color-background);cursor:pointer}
input[type=checkbox]{accent-color:var(--color-accent);width:16px;height:16px;margin:0}
.seed{display:flex;gap:var(--space-2);grid-column:2/4}
.blk{padding:var(--space-3) var(--space-4);border:0;border-bottom:1px solid var(--color-border);margin:0;min-width:0}
.blk h2{margin:0 0 var(--space-2);font-size:15px;line-height:1.35;font-weight:600}
.blk p{margin:0 0 var(--space-2)}.btns{display:flex;flex-wrap:wrap;gap:var(--space-2)}.btns.mt{margin-top:var(--space-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2)}
.fld{display:flex;flex-direction:column;gap:var(--space-1);font-size:12px;color:var(--color-text-muted)}
.chk{display:flex;align-items:center;gap:var(--space-2);font-size:13px;font-weight:500;margin-top:var(--space-2)}
fieldset:disabled{opacity:.5}
.toast{position:fixed;left:50%;bottom:var(--space-5);z-index:50;transform:translate(-50%,8px);padding:var(--space-2) var(--space-4);background:var(--color-background);border:1px solid var(--color-border);border-radius:var(--radius-panel);box-shadow:0 8px 24px -12px rgba(25,52,56,.3);font-size:13px;font-weight:500;opacity:0;pointer-events:none;transition:opacity var(--motion-quick),transform var(--motion-quick)}.toast{display:flex;align-items:center;gap:var(--space-3)}.toast.act{pointer-events:auto}.toast.show{opacity:1;transform:translate(-50%,0)}
dialog{width:min(420px,calc(100% - 32px));padding:var(--space-5);border:1px solid var(--color-border);border-radius:var(--radius-overlay);background:var(--color-background);color:var(--color-text);box-shadow:0 8px 24px -12px rgba(25,52,56,.3);opacity:0;transform:scale(.98);transition:opacity var(--motion-context),transform var(--motion-context),overlay var(--motion-context) allow-discrete,display var(--motion-context) allow-discrete}
dialog[open]{opacity:1;transform:none}@starting-style{dialog[open]{opacity:0;transform:scale(.98)}}
dialog::backdrop{background:rgba(25,52,56,0);transition:background var(--motion-context),overlay var(--motion-context) allow-discrete,display var(--motion-context) allow-discrete}
dialog[open]::backdrop{background:rgba(25,52,56,.32)}@starting-style{dialog[open]::backdrop{background:rgba(25,52,56,0)}}
dialog h2{margin:0 0 var(--space-2);font-size:20px;line-height:1.25;font-weight:600;letter-spacing:-.015em}dialog p{margin:0 0 var(--space-3)}
#dE{min-height:20px;margin:var(--space-2) 0 0;color:var(--color-danger);font-size:12px;line-height:1.4}
.dact{display:flex;justify-content:flex-end;gap:var(--space-2);margin-top:var(--space-3)}
@media(max-width:1023px){
.app{grid-template-columns:minmax(0,1fr)}
aside{position:fixed;z-index:31;top:56px;right:0;bottom:0;width:min(344px,100%);transform:translateX(100%);visibility:hidden;padding-bottom:env(safe-area-inset-bottom,0px);transition:transform var(--motion-spatial) var(--ease),visibility 0s linear var(--motion-spatial)}
.app.insp aside{transform:none;visibility:visible;transition:transform var(--motion-spatial) var(--ease),visibility 0s}
.scrim{display:block;position:fixed;inset:56px 0 0 0;z-index:30;background:rgba(25,52,56,.24);opacity:0;pointer-events:none;transition:opacity var(--motion-context)}
.app.insp .scrim{opacity:1;pointer-events:auto}
#inspBtn{display:inline-flex}.ah{display:flex;align-items:center;justify-content:space-between;padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-border)}}
@media(max-width:767px){aside{top:auto;left:0;width:100%;height:min(72dvh,calc(100dvh - 56px));border-left:0;border-top:1px solid var(--color-border);border-radius:var(--radius-overlay) var(--radius-overlay) 0 0;transform:translateY(100%)}.brand>span{display:none}}
@media(pointer:coarse){.btn,.acts .btn,.btn.ico{height:44px}.btn.ico{width:44px}.btn.fill{height:44px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><span>Studio</span><span aria-hidden="true">/</span><h1>Flow</h1></div>
  <div class="sp"></div>
  <div class="acts">
    <button class="btn" id="rand">Randomise shape</button>
    <details class="menu"><summary class="btn">More</summary><div class="pop">
      <button class="btn" id="cs">Copy SVG</button><button class="btn" id="png">Export PNG</button><button class="btn" id="cj">Copy JSON</button><button class="btn" id="lj">Load JSON</button></div></details>
    <button class="btn fill" id="svg">Export SVG</button>
  </div>
</header>
<main>
  <div class="tb" role="toolbar" aria-label="Canvas tools">
    <div class="grp"><button class="btn" id="imp" title="Import an SVG, PNG or JPG to edit">Import</button></div><i class="div"></i>
    <div class="grp"><button class="btn" id="tUndo">Undo</button><button class="btn" id="tRedo">Redo</button></div><i class="div"></i>
    <div class="grp"><button class="btn" id="tCopy">Copy</button><button class="btn" id="tArea" title="Copy only the part inside the selected area">Copy area</button><button class="btn" id="tCut">Cut</button><button class="btn" id="tPaste">Paste</button><button class="btn" id="tDup">Duplicate</button><button class="btn danger" id="tDel">Delete</button><button class="btn danger" id="tClear" title="Remove every line and the title text">Clear canvas</button></div><i class="div"></i>
    <div class="grp"><button class="btn" id="tAll">Select all</button><button class="btn on" id="tSnap" aria-pressed="true">Snap</button></div>
    <span class="sp"></span><span class="cap" id="meta"></span>
    <div class="grp"><button class="btn ico" id="zOut" aria-label="Zoom out" title="Zoom out"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button><button class="btn" id="zFit">Fit</button><button class="btn ico" id="zIn" aria-label="Zoom in" title="Zoom in"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div>
    <button class="btn" id="inspBtn" aria-controls="insp" aria-expanded="false">Inspector</button>
  </div>
  <div id="wrap"><div id="stage"></div></div>
</main>
<aside id="insp" aria-label="Inspector"><div class="ah"><h2 class="ph">Inspector</h2><button class="btn" id="inspX">Close</button></div>
  <div class="seg" role="tablist"><button class="btn on" role="tab" aria-selected="true" data-tab="gen">Generate</button><button class="btn" role="tab" aria-selected="false" data-tab="edit">Edit</button></div>
  <div id="genPane">
    <div class="note" id="bk" hidden><span class="cap">You are editing lines by hand. Line colour, field and mode settings are paused.</span><button class="btn" id="unbake">Back to generated</button></div>
    <div class="seg" id="modes"></div>
    <div class="presets" id="presets"></div>
    <div class="presets" id="palettes"></div>
    <div id="ctl"></div>
  </div>
  <div id="editPane" hidden></div>
</aside>
<div class="scrim" id="scrim"></div>
</div>
<input type="file" id="impF" accept=".svg,image/svg+xml,image/png,image/jpeg" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg" aria-labelledby="dT" aria-describedby="dB"><form id="dF" method="dialog"><h2 id="dT"></h2><p id="dB"></p><div id="dX"></div><p id="dE" role="alert"></p><div class="dact"><button class="btn" id="dC" type="button"></button><button class="btn fill" id="dOk" type="submit"></button></div></form></dialog>

<script>
/* ==========================================================================
   FlowEngine — pure generator, no DOM. Integration surface for the host app:
     FlowEngine.defaults            full parameter object
     FlowEngine.reg                 plugin registries: mode / field / palette / preset
     FlowEngine.register(kind,def)  add a plugin (before the last line of this file, or call FlowStudio.rebuild())
       'mode'    {id,label,params:[...],defaults:{},generate(p,C,items,R)}  push items {d,fill,w,t,u,v}
       'field'   {id,label,params,defaults,make(p,C)->(x,y,ch)=>number (about +-.5)}
       'palette' {id,label,values:{bg,ink,ink2,accent}}
       'preset'  {id,label,values:{any params}}
     Plugins receive C.field (active field), C.kit (rng,fbm,noise2,poly,pt,mixc) and C.W,H,x0,x1,y0,y1.
     Param descriptors come from FlowEngine.param.num/chk/sel — the UI builds itself from them.
     NEW REFERENCE = register a mode and/or field, then a palette + preset that reproduces it.
     FlowEngine.generate(params) -> { svg, items, W, H }
   `items` is the renderer-agnostic list of primitives (path d, fill/stroke,
   weight, colour, accent flag). params.ov = { [itemIndex]: {c, w, h} } holds
   per-line overrides (colour, weight offset, hidden).
   ========================================================================== */
const FlowEngine=(()=>{
const SIZES={poster:[1000,1414],square:[1000,1000],phone:[1000,2166],story:[1000,1778],wide:[1600,1000]};
const DEF={mode:'s',field:'fbm',size:'poster',margin:38,topInset:250,clip:1,seed:7,
 bg:'#ECE4E0',ink:'#A33714',ink2:'#E08A5B',accent:'#FFFFFF',grad:'none',lineOp:1,fade:0,
 nth:0,accentW:2.2,accentOp:1,glow:0,
 scale:1.1,octaves:3,warp:70,angle:0,waveAmp:45,waveFreq:2.2,waveFall:.9,vs:3.2,vx:.72,vy:.55,vr:.16,twist:1.2,peak:1,tilt:1,
 rows:62,samples:140,tmin:.05,tmax:.92,curve:1.3,flip:0,tvar:.25,
 count:1600,step:3,len:120,wmin:.5,wmax:1,sep:3,
 levels:42,res:110,cw:1,
 showText:1,title1:'ABOUT',title2:'FLOW',body:'Flow is a state of complete immersion in an activity, where time seems to disappear. When you are in flow, your focus is sharp, and tasks feel effortless. Many artists and athletes experience flow when they are deeply engaged in their work. Achieving flow requires a balance between challenge and skill. People who experience flow often report higher levels of happiness and productivity.',
 titleSize:88,bodySize:16,bodyX:.49,textY:150,tcol:'#A33714',bcol:'#A33714',ov:{}};
const PRESETS={
 'Terracotta':{},
 'Hatch':{mode:'l',size:'square',margin:0,topInset:0,bg:'#FFFFFF',ink:'#000000',grad:'none',angle:90,scale:1.6,twist:1.3,vs:0,count:2200,step:3,len:140,wmin:.5,wmax:1,sep:3.4,showText:0,seed:21},
 'Topo night':{mode:'c',size:'phone',margin:0,topInset:0,bg:'#05050A',ink:'#F2C9B5',ink2:'#27C3D4',accent:'#FFFFFF',grad:'position',nth:6,accentW:2.4,glow:3,scale:1.3,peak:1.4,vx:.18,vy:.12,vr:.22,tilt:1.1,angle:70,levels:50,res:120,cw:.8,fade:.6,showText:0,seed:12},
 'Op red':{mode:'s',size:'phone',margin:0,topInset:0,bg:'#FFF9EC',ink:'#FF3B30',grad:'none',rows:40,tmin:.52,tmax:.52,curve:1,tvar:.15,warp:160,scale:.9,octaves:2,waveAmp:0,vs:4.5,vx:.5,vy:.5,vr:.3,angle:90,showText:0,seed:3,samples:160}
};
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
function noise2(seed){const r=rng(seed),p=[...Array(256).keys()];for(let i=255;i>0;i--){const j=r()*(i+1)|0;[p[i],p[j]]=[p[j],p[i]]}const P=[...p,...p];
 const g=(h,x,y)=>{const a=h&7,u=a<4?x:y,v=a<4?y:x;return(a&1?-u:u)+(a&2?-2*v:2*v)};
 const f=t=>t*t*t*(t*(t*6-15)+10),l=(a,b,t)=>a+t*(b-a);
 return(x,y)=>{const X=Math.floor(x)&255,Y=Math.floor(y)&255;x-=Math.floor(x);y-=Math.floor(y);const u=f(x),v=f(y),A=P[X]+Y,B=P[X+1]+Y;
  return l(l(g(P[A],x,y),g(P[B],x-1,y),u),l(g(P[A+1],x,y-1),g(P[B+1],x-1,y-1),u),v)*.5}}
const fbm=(n,x,y,o)=>{let s=0,a=1,f=1,t=0;for(let i=0;i<o;i++){s+=a*n(x*f,y*f);t+=a;a*=.5;f*=2}return s/t};
const hx=h=>{h=h.replace('#','');if(h.length==3)h=[...h].map(c=>c+c).join('');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const mixc=(a,b,t)=>{const A=hx(a),B=hx(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')};
const pt=(x,y)=>x.toFixed(1)+' '+y.toFixed(1);
const poly=a=>'M'+a.map(q=>pt(q[0],q[1])).join('L');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const wrap=(t,n)=>{const L=[];let c='';for(const x of t.split(/\s+/)){if((c+' '+x).trim().length>n){L.push(c);c=x}else c=(c+' '+x).trim()}if(c)L.push(c);return L};

/* Ribbons: filled bands whose centre-lines are pushed through a warp field (noise + wave + vortex) */
function stripes(p,C,items,R){
 const s=p.scale/1000,{W,H}=C,cx=W/2,cy=H/2,an=p.angle*Math.PI/180,ca=Math.cos(an),sa=Math.sin(an),N=p.rows;

/* Randomise shape: keeps your colours, shuffles the field */

const copy=(t,m)=>(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(m),()=>toast('Copy failed. Allow clipboard access and try again.'));

 el.onclick=e=>{const b=e.target.closest('[data-p]');if(b)guard().then(ok=>{if(ok){const v=FlowEngine.reg.palette[b.dataset.p].values;Object.assign(P,v,{tcol:v.ink,bcol:v.ink});P.ov={};P.baked=null;clearSel();refresh()}})}}

/* Inspector drawer on tablet and mobile */
const APP=$('.app'),MQ=matchMedia('(max-width:1023px)');
function insp(o,back){APP.classList.toggle('insp',o);$('#inspBtn').setAttribute('aria-expanded',o);$('main').inert=o&&MQ.matches;if(o)$('#inspX').focus();else if(back)$('#inspBtn').focus()}
$('#inspBtn').onclick=()=>insp(!APP.classList.contains('insp'));$('#inspX').onclick=$('#scrim').onclick=()=>insp(false,1);

MQ.addEventListener('change',()=>insp(false));
$('#tClear').onclick=()=>{PREV={P:{...P},HIST:[...HIST],REDO:[...REDO],OV0};ensureBaked();commit([]);P.showText=0;SEL=new Set();LASTRECT=null;pkey='';refresh();toast('Canvas cleared.',['Undo',restore])};
/* Import: SVG shapes become editable lines; PNG/JPG are traced into contour lines */
const hex2=c=>{const m=(c||'').match(/rgba?\(([^)]+)\)/);return m?'#'+m[1].split(',').slice(0,3).map(v=>(+v|0).toString(16).padStart(2,'0')).join(''):/^#/.test(c)?c:'#888888'};
function place(raw){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;raw.forEach(r=>r.subs.forEach(q=>q.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])})));
 const bw=x1-x0||1,bh=y1-y0||1,k=Math.min(res.W*.8/bw,res.H*.8/bh),tx=res.W/2-(x0+bw/2)*k,ty=res.H/2-(y0+bh/2)*k;
 return raw.map(r=>({d:r.subs.map(q=>'M'+q.map(p=>(p[0]*k+tx).toFixed(1)+' '+(p[1]*k+ty).toFixed(1)).join('L')+(r.closed?'Z':'')).join(''),fill:r.fill?1:0,col:r.col,sw:r.fill?0:Math.max(.3,r.sw*(r.abs?1:k)),op:r.op,acc:false,tf:[1,0,0,1,0,0],h:false}))}
function impSVG(txt){const doc=new DOMParser().parseFromString(txt,'image/svg+xml'),src=doc.documentElement;if(src.nodeName!='svg'||doc.querySelector('parsererror'))throw 0;
 const svg=document.importNode(src,true);svg.querySelectorAll('script,foreignObject').forEach(n=>n.remove());[svg,...svg.querySelectorAll('*')].forEach(n=>[...n.attributes].forEach(a=>/^on/i.test(a.name)&&n.removeAttribute(a.name)));
 if(!svg.getAttribute('viewBox')){const w=parseFloat(src.getAttribute('width')),h=parseFloat(src.getAttribute('height'));if(w&&h)svg.setAttribute('viewBox',`0 0 ${w} ${h}`)}
 svg.setAttribute('width','1000');svg.setAttribute('height','1000');const box=document.createElement('div');box.style.cssText='position:fixed;left:0;top:0;width:1000px;height:1000px;visibility:hidden;pointer-events:none';box.appendChild(svg);document.body.appendChild(box);
 const raw=[];try{const inv=svg.getScreenCTM().inverse();svg.querySelectorAll('path,line,polyline,polygon,rect,circle,ellipse').forEach(el=>{if(raw.length>4000||el.closest('defs,clipPath,mask,symbol,pattern,marker'))return;
  const L=el.getTotalLength();if(!(L>0))return;const n=Math.max(8,Math.min(500,Math.round(L/3))),st=L/n,M=inv.multiply(el.getScreenCTM()),cs=getComputedStyle(el),subs=[];let cur=null,pv=null;
  for(let i=0;i<=n;i++){const q=el.getPointAtLength(L*i/n);if(!cur||(pv&&Math.hypot(q.x-pv.x,q.y-pv.y)>st*2.5+.01)){cur=[];subs.push(cur)}pv=q;const t=new DOMPoint(q.x,q.y).matrixTransform(M);cur.push([t.x,t.y])}
  const op=+cs.opacity||1,closed=/^(polygon|rect|circle|ellipse)$/.test(el.localName)||/z\s*$/i.test(el.getAttribute('d')||'');
  if(cs.fill!='none')raw.push({subs,closed:true,fill:1,col:hex2(cs.fill),sw:0,op});
  if(cs.stroke!='none')raw.push({subs,closed,fill:0,col:hex2(cs.stroke),sw:parseFloat(cs.strokeWidth)||1,op})})}finally{box.remove()}
 return place(raw)}
function impImg(img){const m=Math.min(1,180/Math.max(img.width,img.height)),w=Math.max(2,Math.round(img.width*m)),h=Math.max(2,Math.round(img.height*m)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
 const D=x.getImageData(0,0,w,h).data,V=new Float32Array(w*h);for(let i=0;i<w*h;i++)V[i]=(.2126*D[i*4]+.7152*D[i*4+1]+.0722*D[i*4+2])/255;
 const T=[0,[3,2],[2,1],[3,1],[0,1],[[0,3],[2,1]],[0,2],[0,3],[0,3],[0,2],[[0,1],[3,2]],[0,1],[3,1],[2,1],[3,2],0],N=9,raw=[];
 for(let k=0;k<N;k++){const lv=(k+.5)/N,subs=[];for(let j=0;j<h-1;j++)for(let i=0;i<w-1;i++){const a=V[j*w+i],b=V[j*w+i+1],cc=V[(j+1)*w+i+1],e=V[(j+1)*w+i],tt=T[(a>lv?8:0)|(b>lv?4:0)|(cc>lv?2:0)|(e>lv?1:0)];if(!tt)continue;
   const E=q=>q==0?[i+(lv-a)/(b-a),j]:q==1?[i+1,j+(lv-b)/(cc-b)]:q==2?[i+(lv-e)/(cc-e),j+1]:[i,j+(lv-a)/(e-a)];(Array.isArray(tt[0])?tt:[tt]).forEach(([q1,q2])=>subs.push([E(q1),E(q2)]))}
  if(subs.length)raw.push({subs,closed:false,fill:0,col:FlowEngine.kit.mixc(P.ink,P.ink2,k/(N-1)),sw:1.2,op:1,abs:1})}
 return place(raw)}
async function impFile(f){try{let list;if(/svg/i.test(f.type)||/\.svg$/i.test(f.name))list=impSVG(await f.text());else{const u=URL.createObjectURL(f),img=new Image();await new Promise((ok,no)=>{img.onload=ok;img.onerror=no;img.src=u});URL.revokeObjectURL(u);list=impImg(img)}
 if(!list.length){toast('Nothing to import. That file has no paths or shapes to edit.');return}
 addObjs(list,0,0);tab('edit');toast(`Imported ${list.length} lines. Move, recolour or restyle them in Edit.`)}catch(e){toast('Could not import that file. Use an SVG, PNG or JPG.')}}

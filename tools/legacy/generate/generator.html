<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generative Art Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F7F6;--pn:#fff;--tx:#193438;--mu:#526C6E;--ln:#DEE7E5;--ct:#A7BFC0;--ac:#236F72;--acp:#19595C;--sa:#DCEFEB;--sh:#EAF1EF;--st:#182D30;--sf:"Instrument Sans",Inter,system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1A1B;--pn:#162426;--tx:#E6F0EF;--mu:#9DB3B4;--ln:#2A3D3F;--ct:#3F5A5C;--ac:#3E9A9D;--acp:#2F8285;--sa:#21403F;--sh:#1C3234;--st:#0A1314}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.45 var(--sf)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;min-height:56px;padding:8px 16px;border-bottom:1px solid var(--ln);background:var(--pn)}
h1{font:600 20px/1.25 var(--sf);letter-spacing:-.015em;margin:0 12px 0 0}
main{display:grid;grid-template-columns:240px 1fr 320px;gap:0;min-height:calc(100vh - 56px)}
aside,section{padding:16px;min-width:0}aside{background:var(--pn)}section{background:var(--bg)}
#L{border-right:1px solid var(--ln)}#R{border-left:1px solid var(--ln)}
h2{font:600 15px/1.35 var(--sf);color:var(--tx);margin:0 0 12px}
select,input[type=text],button{font:500 13px/1.3 var(--sf);color:var(--tx);background:var(--pn);border:1px solid var(--ct);border-radius:8px;padding:0 12px;min-height:36px}
button{cursor:pointer}button:hover{background:var(--sh)}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}button.p:hover{background:var(--acp)}
label.c{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font:500 12px/1.4 var(--sf);color:var(--mu)}
label.c select{width:100%}
.as{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--ln)}
.as input[type=text]{flex:1;min-width:0}.as small{color:var(--mu);flex:1}
.seg{display:inline-flex;border:1px solid var(--ct);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:34px}.seg button.on{background:var(--sa);color:var(--tx);font-weight:600}
.var{border:2px solid transparent;border-radius:10px;padding:12px;margin-bottom:16px;background:var(--st);color:#fff;cursor:pointer}
.var.sel{border-color:#fff}.var h3{margin:0 0 8px;font:500 12px/1.4 var(--sf);display:flex;justify-content:space-between}
.row{display:flex;gap:8px;overflow-x:auto}
.slide{position:relative;width:200px;aspect-ratio:4/5;flex:none;overflow:hidden;container-type:inline-size;border-radius:4px}
.slide.big{width:260px}
.bg,.tex,.acc{position:absolute;inset:0;pointer-events:none}
.el{position:absolute;line-height:1.02;white-space:pre-line}
.sph{border-radius:50%;aspect-ratio:1}
.ring{border-radius:50%;aspect-ratio:1;animation:sp 8s linear infinite}
@keyframes sp{to{rotate:360deg}}
.mo{animation:dr 9s ease-in-out infinite alternate}@keyframes dr{to{background-position:100% 100%}}
#st{font-size:11px;color:var(--mu);margin:0 0 10px}
@media (max-width:820px){main{grid-template-columns:1fr}#L,#R{border:0}}
</style></head><body>
<header><h1>Generative Art</h1>
<div class="seg" id="fmt"></div><span id="slw"></span>
<div class="seg" id="mode"></div>
<button class="p" id="regen">Regenerate</button><button id="exp">Export spec</button></header>
<main>
<aside id="L"><h2>Assets</h2><div id="al"></div>
<div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap"><button id="addT">+ Text</button><button id="addI">+ Image</button><input type="file" id="fi" accept="image/*" hidden></div>
<p style="color:var(--mu);font-size:11px">Samples stand in for assets from the other domains. All are on by default.</p></aside>
<section><p id="st"></p><div id="C"></div></section>
<aside id="R"><h2>Creative controls</h2><div id="ct"></div></aside>
</main>
<script>
const OPT={
style:['Minimal','Editorial','Experimental','Brutalist','Surreal'],
layout:['Auto (mix)','Grid-based','Centered','Dynamic / asymmetrical','Layered / overlapping'],
hierarchy:['Typography-led','3D / image-led','Balanced'],
density:['Sparse','Balanced','Dense'],
negative:['Generous margins','Balanced','Tight / packed'],
overlap:['Separated','Moderate overlap','Heavy overlap'],
colour:['Preserve original','Monochrome','Complementary','High contrast','Generate new palette'],
background:['Atmospheric','Abstract','Image-based','Material-based','Depth-based','Motion-based'],
accents:['None','Lines & borders','Geometric shapes','Small marks','Frames & dividers'],
texture:['Smooth gradient','Film grain','Paper','Noise','Distressed'],
freedom:['Conservative','Balanced','Experimental'],
variations:['3','2','1']};
const S={fmt:'post',slides:3,mode:'rules',seed:1,sel:0,vars:[],gen:0,
ctl:{style:'Minimal',layout:'Auto (mix)',hierarchy:'Balanced',density:'Balanced',negative:'Balanced',overlap:'Moderate overlap',colour:'Preserve original',background:'Atmospheric',accents:'None',texture:'Film grain',freedom:'Balanced',variations:'3'},
assets:[{id:'a1',type:'text',role:'head',text:'Make it\nloud',on:1},{id:'a2',type:'text',role:'sub',text:'Issue 04 · Autumn 2026',on:1},{id:'a3',type:'obj',name:'3D sphere',on:1},{id:'a4',type:'img',name:'Photo',src:null,on:1},{id:'a5',type:'vec',name:'Vector burst',on:1},{id:'a6',type:'motion',name:'Motion ring',on:1}]};
const $=s=>document.querySelector(s);
const rngF=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LAY=['Grid-based','Centered','Dynamic / asymmetrical','Layered / overlapping'];
/* ---------- palette ---------- */
function pal(c,seed){const r=rngF(seed*7+3),h=Math.floor(r()*360);
if(c.colour==='Monochrome')return{b1:`hsl(${h} 12% 90%)`,b2:`hsl(${h} 18% 78%)`,fg:`hsl(${h} 30% 10%)`,a1:`hsl(${h} 35% 35%)`,a2:`hsl(${h} 25% 55%)`};
if(c.colour==='Complementary')return{b1:`hsl(${h} 40% 14%)`,b2:`hsl(${h} 50% 24%)`,fg:'#fff',a1:`hsl(${h} 90% 60%)`,a2:`hsl(${(h+180)%360} 90% 58%)`};
if(c.colour==='High contrast')return{b1:'#000',b2:'#111',fg:'#fff',a1:'#ffe600',a2:'#00e5ff'};
if(c.colour==='Generate new palette')return{b1:`hsl(${h} 70% 88%)`,b2:`hsl(${(h+60)%360} 75% 76%)`,fg:`hsl(${(h+200)%360} 60% 14%)`,a1:`hsl(${(h+300)%360} 85% 55%)`,a2:`hsl(${(h+30)%360} 90% 60%)`};
return{b1:'#f3efe6',b2:'#e2dccf',fg:'#141414',a1:'#ff5a36',a2:'#3a6cff'}}
/* ---------- rule engine ---------- */
const BASE={head:55,sub:50,obj:34,img:36,vec:24,motion:28},FOC={head:78,obj:62,img:60};
const AR={head:.5,sub:.14,obj:1,img:1.25,vec:1,motion:1};
const kind=a=>a.type==='text'?a.role||'sub':a.type;
function rules(assets,c,rng,si,layout){
const el=assets.filter(a=>a.on);if(!el.length)return[];
const fr=c.freedom==='Conservative'?0:c.freedom==='Balanced'?1:2;
let foc=null;const find=t=>el.find(a=>kind(a)===t);
const hier=si===1&&c.hierarchy!=='Typography-led'||si===1?'3D / image-led':si===2?'Balanced':c.hierarchy;
if(hier==='Typography-led')foc=find('head');else if(hier==='3D / image-led')foc=find('img')||find('obj')||find('head');
const dm={Sparse:.85,Balanced:1,Dense:1.15}[c.density],m={'Generous margins':16,Balanced:9,'Tight / packed':3}[c.negative];
const P=el.map(a=>{const k=kind(a),isF=a===foc;let w=(isF&&FOC[k]||BASE[k]||30)*(isF?1:dm);
if(fr===2)w*=.75+rng()*.8;else if(fr===1)w*=.9+rng()*.2;
w=Math.min(w,100-m*1.2);return{a,k,id:a.id,w,h:w*AR[k],x:50,y:62,r:0,z:{head:4,sub:4,obj:3,img:2,vec:1,motion:1}[k]+(isF?2:0),isF}});
const n=P.length;
P.forEach((p,i)=>{
if(layout==='Centered'){if(p.isF||(!foc&&i===0)){p.x=50;p.y=62}else{const g=P.filter(q=>!(q.isF||(!foc&&q===P[0]))),j=g.indexOf(p),an=(j/Math.max(g.length,1))*6.283+rng()*.6;p.x=50+Math.cos(an)*(38-m*.4);p.y=62+Math.sin(an)*(46-m*.4)}}
else if(layout==='Grid-based'){const rows=Math.ceil(n/2),cx=i%2,rw=i>>1;p.x=m+(100-2*m)*(cx?.75:.25);p.y=m*1.25+(125-2.5*m)*((rw+.5)/rows);if(n%2&&i===n-1){p.x=50}}
else if(layout==='Dynamic / asymmetrical'){p.x=p.isF?30+rng()*40:m+rng()*(100-2*m);p.y=p.isF?40+rng()*45:m+rng()*(125-2*m);if(rng()>.5)p.x=100-p.x}
else{p.x=50+(rng()-.5)*28;p.y=62+(rng()-.5)*34}
const rr=[0,6,34][fr]*(layout==='Grid-based'?.3:1);p.r=(rng()-.5)*rr});
const k={Separated:1,'Moderate overlap':.18,'Heavy overlap':-.04}[c.overlap],lo=fr===2?-8:m,hiX=fr===2?108:100-m,hiY=fr===2?133:125-m;
for(let it=0;it<60;it++){for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const a=P[i],b=P[j],dx=b.x-a.x,dy=b.y-a.y,ox=(a.w+b.w)/2-Math.abs(dx),oy=(a.h+b.h)/2-Math.abs(dy);
if(k>0&&ox>0&&oy>0){const f=k*.06;if(ox<oy){const s=Math.sign(dx)||1;a.x-=s*ox*f;b.x+=s*ox*f}else{const s=Math.sign(dy)||1;a.y-=s*oy*f;b.y+=s*oy*f}}
else if(k<0&&(Math.abs(dx)>a.w*.3||Math.abs(dy)>a.h*.3)){a.x+=dx*.01;b.x-=dx*.01;a.y+=dy*.01;b.y-=dy*.01}}
P.forEach(p=>{p.x=Math.max(lo+p.w/2*(fr===2?.3:1),Math.min(hiX-p.w/2*(fr===2?.3:1),p.x));p.y=Math.max(lo+p.h/2*(fr===2?.3:1),Math.min(hiY-p.h/2*(fr===2?.3:1),p.y))})}
return P.map(p=>({id:p.id,x:+p.x.toFixed(1),y:+p.y.toFixed(1),w:+p.w.toFixed(1),r:+p.r.toFixed(1),z:p.z}))}
/* ---------- rendering ---------- */
const FONT={Minimal:'font:300 1 system-ui,sans-serif;letter-spacing:-.02em',Editorial:'font:700 1 Georgia,serif;letter-spacing:-.03em',Experimental:'font:600 1 ui-monospace,Menlo,monospace;font-style:italic;text-transform:uppercase',Brutalist:'font:900 1 Impact,"Arial Black",sans-serif;text-transform:uppercase',Surreal:'font:italic 400 1 Georgia,serif'};
const fnt=(s,sz)=>FONT[s].replace(' 1 ',` ${sz}cqw/1.02 `);
function bgHtml(c,P,rng,img){const g=(a,b)=>`linear-gradient(${Math.floor(rng()*360)}deg,${a},${b})`;
const bgm=c.background;let h='';
if(bgm==='Atmospheric')h=`background:radial-gradient(60% 50% at ${20+rng()*60}% ${rng()*60}%,${P.a2}88,transparent),${g(P.b1,P.b2)}`;
else if(bgm==='Abstract')h=`background:${g(P.b1,P.b2)}`,extra=`<svg viewBox="0 0 100 125" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%">${Array.from({length:5},()=>`<circle cx="${rng()*100}" cy="${rng()*125}" r="${6+rng()*22}" fill="${rng()>.5?P.a1:P.a2}" opacity=".18"/>`).join('')}${Array.from({length:4},(_,i)=>`<rect x="${rng()*80}" y="${i*30+rng()*8}" width="${15+rng()*40}" height="2" fill="${P.fg}" opacity=".25"/>`).join('')}</svg>`;
else if(bgm==='Image-based')h=img?`background:linear-gradient(${P.b1}66,${P.b2}aa),url(${img}) center/cover`:`background:linear-gradient(160deg,${P.a2}99,${P.a1}77),${g(P.b1,P.b2)}`;
else if(bgm==='Material-based')h=`background:repeating-linear-gradient(${Math.floor(rng()*180)}deg,${P.b1} 0 2px,${P.b2} 2px 4px)`;
else if(bgm==='Depth-based')h=`background:${g(P.b1,P.b2)}`,extra=Array.from({length:4},(_,i)=>`<div style="position:absolute;left:${rng()*80}%;top:${rng()*80}%;width:${20+i*12}%;aspect-ratio:1;border-radius:50%;background:${i%2?P.a1:P.a2};opacity:.35;filter:blur(${3+i*3}px)"></div>`).join('');
else h=`background:linear-gradient(120deg,${P.b1},${P.a2}77,${P.b2},${P.a1}66);background-size:300% 300%`,cls=' mo';
return`<div class="bg${typeof cls!=='undefined'?cls:''}" style="${h}"></div>`+(typeof extra!=='undefined'?extra:'')}
var extra,cls;
const GR=(f,o,b)=>`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='${f}' numOctaves='3'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='${o}'/></svg>`)}")`;
function texHtml(t){const m={'Film grain':[.9,.35],Paper:[.04,.3],Noise:[.5,.5],Distressed:[.6,.55]}[t];return m?`<div class="tex" style="background:${GR(m[0],1)};opacity:${m[1]};mix-blend-mode:multiply;${t==='Distressed'?'-webkit-mask-image:radial-gradient(circle at 30% 40%,#000 20%,transparent 90%);':''}"></div>`:''}
function accHtml(c,P,rng){const a=c.accents,f=P.fg,s=`position:absolute;`;
if(a==='Lines & borders')return`<div class="acc"><div style="${s}left:6%;right:6%;top:6%;height:2px;background:${f}"></div><div style="${s}left:6%;right:6%;bottom:6%;height:2px;background:${f}"></div></div>`;
if(a==='Geometric shapes')return`<div class="acc"><div style="${s}left:${rng()*70}%;top:${rng()*80}%;width:12%;aspect-ratio:1;border:.8cqw solid ${P.a1};border-radius:50%"></div><div style="${s}right:${rng()*30}%;top:${rng()*70}%;width:10%;aspect-ratio:1;background:${P.a2};opacity:.8"></div></div>`;
if(a==='Small marks')return`<div class="acc" style="font:700 4cqw monospace;color:${f}"><span style="${s}left:5%;top:4%">+</span><span style="${s}right:5%;top:4%">+</span><span style="${s}left:5%;bottom:3%">+</span><span style="${s}right:5%;bottom:3%">+</span></div>`;
if(a==='Frames & dividers')return`<div class="acc" style="inset:4cqw;border:.7cqw solid ${f}"></div>`;return''}
function elHtml(p,a,P,c,img){const k=kind(a),s=c.style;
let st=`left:${p.x}%;top:${p.y/1.25}%;width:${p.w}%;transform:translate(-50%,-50%) rotate(${p.r}deg);z-index:${p.z};`,h='';
const org=c.colour==='Preserve original';
if(k==='head'){st+=`color:${P.fg};text-align:center;${fnt(s,p.w*.27)};${s==='Brutalist'?`text-shadow:.8cqw .8cqw 0 ${P.a1};`:''}${s==='Surreal'?`background:linear-gradient(90deg,${P.a1},${P.a2});-webkit-background-clip:text;color:transparent;`:''}`;h=esc(a.text)}
else if(k==='sub'){st+=`color:${P.fg};text-align:center;${fnt(s,p.w*.085)};font-weight:400`;h=esc(a.text)}
else if(k==='obj'){st+=`background:radial-gradient(circle at 32% 28%,#fff 0,${P.a2} 30%,${P.a1} 75%,#000 130%);box-shadow:0 ${p.w*.2}cqw ${p.w*.3}cqw #0004;aspect-ratio:1`;h='<div class="sph" style="width:100%;height:100%"></div>'.replace('<div','<i').replace('</div>','</i>');h=''}
else if(k==='img'){const src=a.src||img;st+=`aspect-ratio:4/5;background:${src?`url(${src}) center/cover`:`linear-gradient(180deg,${P.a2} 0 45%,${P.a1} 45% 70%,${P.fg} 70%)`};border-radius:${s==='Brutalist'?0:s==='Surreal'?'50% 50% 0 0':'1cqw'};${s==='Brutalist'?`border:1cqw solid ${P.fg}`:''}`}
else if(k==='vec'){st+='aspect-ratio:1';const pts=Array.from({length:24},(_,i)=>{const r=i%2?28:48,an=i*Math.PI/12;return(50+r*Math.cos(an)).toFixed(1)+','+(50+r*Math.sin(an)).toFixed(1)}).join(' ');h=`<svg viewBox="0 0 100 100" style="width:100%;height:100%"><polygon points="${pts}" fill="${org?P.a2:P.a1}"/></svg>`}
else{st+=`border:${Math.max(p.w*.08,.6)}cqw dashed ${P.fg};aspect-ratio:1`;return`<div class="el ring" style="${st}"></div>`}
if(k==='obj')st+=';border-radius:50%';
return`<div class="el" style="${st}">${h}</div>`}
function slideHtml(pl,c,seed,assets,big){const P=pal(c,seed),rng=rngF(seed*13+5),img=(assets.find(a=>a.type==='img'&&a.src)||{}).src;
extra=undefined;cls=undefined;
const body=pl.map(p=>{const a=assets.find(x=>x.id===p.id);return a?elHtml(p,a,P,c,img):''}).join('');
return`<div class="slide${big?' big':''}">${bgHtml(c,P,rng,img)}${body}${accHtml(c,P,rng)}${texHtml(c.texture)}</div>`}
/* ---------- generation ---------- */
const FIXED=[{style:'Minimal',layout:'Centered',hierarchy:'Typography-led',density:'Sparse',negative:'Generous margins',overlap:'Separated',colour:'Preserve original',background:'Atmospheric',accents:'None',texture:'Paper',freedom:'Conservative'},{style:'Editorial',layout:'Grid-based',hierarchy:'Balanced',density:'Balanced',negative:'Balanced',overlap:'Moderate overlap',colour:'Preserve original',background:'Material-based',accents:'Lines & borders',texture:'Film grain',freedom:'Conservative'},{style:'Brutalist',layout:'Layered / overlapping',hierarchy:'3D / image-led',density:'Dense',negative:'Tight / packed',overlap:'Heavy overlap',colour:'High contrast',background:'Abstract',accents:'Small marks',texture:'Noise',freedom:'Balanced'}];
const nSl=()=>S.fmt==='post'?1:S.slides;
function ruleVars(fixed){const N=+S.ctl.variations,out=[];
for(let v=0;v<N;v++){const c=fixed?{...S.ctl,...FIXED[v]}:S.ctl,seed=fixed?v+1:S.seed*100+v*17,L=c.layout==='Auto (mix)'?LAY[(v+S.seed)%4]:c.layout,sl=[];
for(let i=0;i<nSl();i++)sl.push(rules(S.assets,c,rngF(seed+i*31),i,L));
out.push({c,seed,sl})}return out}
async function claudeVars(){const sm=await claude.use('sample');if(!sm)throw new Error('Claude sampling is unavailable here');
const N=+S.ctl.variations,ns=nSl(),el=S.assets.filter(a=>a.on).map(a=>({id:a.id,kind:kind(a),aspect_h_over_w:AR[kind(a)]}));
const q=`You are a layout engine for an Instagram ${ns>1?'carousel':'post'} canvas 100 wide x 125 tall (4:5). Place these elements: ${JSON.stringify(el)}.\nCreative settings: ${JSON.stringify(S.ctl)}.\nReturn ONLY JSON: {"variants":[ [ [ {"id":string,"x":number,"y":number,"w":number,"r":number,"z":integer} ] ] ]}. Outer array = ${N} distinct variants, each with ${ns} slides, each slide with one placement per element id. x,y = element CENTER (x 0-100, y 0-125), w = width in canvas-width units (10-95), r = rotation degrees, z = stacking. Respect margins (negative space), density, overlap, hierarchy and creative freedom. Keep a coherent identity across slides while varying composition.`;
const d=await sm.json(q,{modelTier:'quick',cache:false});
const ids=new Set(el.map(e=>e.id)),ok=x=>Array.isArray(x)&&x.length;
if(!ok(d.variants))throw new Error('Unexpected response');
return d.variants.slice(0,N).map((v,i)=>({c:S.ctl,seed:S.seed*100+i*17,sl:v.slice(0,ns).map(s=>s.filter(p=>ids.has(p.id)&&isFinite(p.x+p.y+p.w)).map(p=>({id:p.id,x:+p.x,y:+p.y,w:Math.max(8,Math.min(100,+p.w)),r:+p.r||0,z:p.z|0})))}))}
let tmr;const sched=()=>{clearTimeout(tmr);tmr=setTimeout(gen,350)};
async function gen(){const my=++S.gen;let note='';
if(S.mode==='claude'){$('#st').textContent='Asking Claude to arrange the layouts…';
try{const v=await claudeVars();if(my!==S.gen)return;S.vars=v;note='Layouts decided by Claude.'}
catch(e){if(my!==S.gen)return;S.vars=ruleVars(false);note='Claude mode failed ('+(e&&e.message||e.code||'error')+'), showing rule-based layouts instead.'}}
else if(S.mode==='static'){S.vars=ruleVars(true);note='Static mode: pre-set examples that ignore the controls.'}
else{S.vars=ruleVars(false);note='Rule-based engine: instant, runs in your browser.'}
S.sel=Math.min(S.sel,S.vars.length-1);$('#st').textContent=note;draw()}
function draw(){$('#C').innerHTML=S.vars.map((v,i)=>`<div class="var${i===S.sel?' sel':''}" data-i="${i}"><h3><span>Alternative ${i+1}${v.c.layout&&S.mode!=='claude'?' · '+(v.c.layout==='Auto (mix)'?LAY[(i+S.seed)%4]:v.c.layout):''}</span><span>${i===S.sel?'Selected':'Select'}</span></h3><div class="row">${v.sl.map(pl=>slideHtml(pl,v.c,v.seed,S.assets)).join('')}</div></div>`).join('')}
/* ---------- UI ---------- */
function seg(el,items,cur,cb){el.innerHTML=items.map(([k,l])=>`<button class="${k===cur?'on':''}" data-k="${k}">${l}</button>`).join('');el.onclick=e=>{const k=e.target.dataset.k;if(k){cb(k);}}}
function head(){seg($('#fmt'),[['post','Single post'],['carousel','Carousel']],S.fmt,k=>{S.fmt=k;head();sched()});
$('#slw').innerHTML=S.fmt==='carousel'?`Slides <select id="ns">${[1,2,3].map(n=>`<option ${n===S.slides?'selected':''}>${n}</option>`).join('')}</select>`:'';
if($('#ns'))$('#ns').onchange=e=>{S.slides=+e.target.value;sched()};
seg($('#mode'),[['rules','Rule-based'],['claude','Claude'],['static','Static']],S.mode,k=>{S.mode=k;head();gen()})}
function assets(){$('#al').innerHTML=S.assets.map(a=>`<div class="as"><input type="checkbox" data-id="${a.id}" ${a.on?'checked':''}>${a.type==='text'?`<input type="text" data-t="${a.id}" value="${esc(a.text)}">`:`<small>${esc(a.name)}${a.type==='img'&&a.src?' (yours)':''}</small>`}</div>`).join('')}
$('#al').onchange=e=>{const id=e.target.dataset.id;if(id){S.assets.find(a=>a.id===id).on=e.target.checked?1:0;sched()}};
$('#al').oninput=e=>{const id=e.target.dataset.t;if(id){S.assets.find(a=>a.id===id).text=e.target.value;sched()}};
$('#addT').onclick=()=>{S.assets.push({id:'t'+Date.now(),type:'text',role:'sub',text:'New text',on:1});assets();sched()};
$('#addI').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const ex=S.assets.find(a=>a.type==='img'&&!a.src);if(ex){ex.src=r.result;ex.name=f.name}else S.assets.push({id:'i'+Date.now(),type:'img',name:f.name,src:r.result,on:1});assets();sched()};r.readAsDataURL(f);e.target.value=''};
$('#ct').innerHTML=Object.keys(OPT).map(k=>`<label class="c">${k[0].toUpperCase()+k.slice(1)}<select data-c="${k}">${OPT[k].map(o=>`<option ${S.ctl[k]===o?'selected':''}>${o}</option>`).join('')}</select></label>`).join('');
$('#ct').onchange=e=>{const k=e.target.dataset.c;if(k){S.ctl[k]=e.target.value;sched()}};
$('#C').onclick=e=>{const v=e.target.closest('.var');if(v){S.sel=+v.dataset.i;draw()}};
$('#regen').onclick=()=>{S.seed++;gen()};
$('#exp').onclick=async()=>{const v=S.vars[S.sel];if(!v)return;const d=JSON.stringify({format:S.fmt,controls:S.ctl,mode:S.mode,slides:v.sl},null,1);
try{const dl=await claude.use('downloads');if(!dl){$('#st').textContent='Export is unavailable in this view.';return}await dl.save({filename:'composition-spec.json',data:d});$('#st').textContent='Export requested.'}catch(e){$('#st').textContent='Export not completed.'}};
head();assets();gen();
</script></body></html>
